# Render Blueprint for the backend (FastAPI). The frontend is deployed separately on Vercel (web/).
# Render -> New -> Blueprint -> pick this repository. See DEPLOY.md.
services:
  - type: web
    name: vlsi-toolkit-api
    runtime: python # Python version comes from .python-version (3.12)
    plan: free
    region: singapore
    # the second step compiles the WebAssembly Yosys once at build time (slow on the free CPU at run time)
    buildCommand: pip install -r requirements.txt && python -m vlsi_toolkit.yosys_synth --warm
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS # your Vercel address, e.g. https://vlsi-toolkit.vercel.app
        sync: false
      - key: MONGODB_URI # MongoDB Atlas connection string (optional): permanent Trends, activity log, feedback
        sync: false
