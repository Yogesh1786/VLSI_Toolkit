[project]
name = "vlsi-toolkit"
version = "0.5.0"
description = "Python helpers for chip design (VLSI) flows, with a React web app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141",
    "pymongo>=4.6",            # MongoDB storage, used only when MONGODB_URI is set          # API server; the core toolkit itself needs only the standard library
]
